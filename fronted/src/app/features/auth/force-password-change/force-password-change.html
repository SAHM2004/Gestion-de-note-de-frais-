<div class="min-h-screen bg-surface-container flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl overflow-hidden p-8">
      <div class="text-center mb-8">
        <div class="w-16 h-16 bg-primary/10 text-primary rounded-2xl flex items-center justify-center mx-auto mb-4">
          <span class="material-symbols-outlined text-3xl">lock_reset</span>
        </div>
        <h1 class="text-headline-sm font-bold text-on-surface mb-2">Sécurisez votre compte</h1>
        <p class="text-on-surface-variant text-sm">
          C'est votre première connexion. Vous devez modifier le mot de passe attribué par l'administrateur avant de continuer.
        </p>
      </div>
  
      <form (ngSubmit)="onSubmit()" class="space-y-5">
        @if (errorMessage) {
          <div class="bg-red-50 text-red-700 p-4 rounded-xl text-sm flex items-start gap-3 border border-red-100 animate-in fade-in">
            <span class="material-symbols-outlined text-red-500 shrink-0">error</span>
            <p class="mt-0.5">{{ errorMessage }}</p>
          </div>
        }
  
        <div>
          <label class="block text-sm font-bold text-on-surface-variant mb-1.5">Mot de passe actuel</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50">key</span>
            <input type="password" name="oldPassword" [(ngModel)]="oldPassword"
              class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl py-3 pl-12 pr-4 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all text-on-surface"
              placeholder="Saisissez le mot de passe actuel" required>
          </div>
        </div>
  
        <div>
          <label class="block text-sm font-bold text-on-surface-variant mb-1.5">Nouveau mot de passe</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50">lock</span>
            <input type="password" name="newPassword" [(ngModel)]="newPassword"
              class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl py-3 pl-12 pr-4 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all text-on-surface"
              placeholder="Min. 6 caractères" required minlength="6">
          </div>
        </div>
  
        <div>
          <label class="block text-sm font-bold text-on-surface-variant mb-1.5">Confirmez le mot de passe</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50">lock</span>
            <input type="password" name="confirmPassword" [(ngModel)]="confirmPassword"
              class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl py-3 pl-12 pr-4 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all text-on-surface"
              placeholder="Répétez le nouveau mot de passe" required>
          </div>
        </div>
  
        <button type="submit" [disabled]="isLoading"
          class="w-full bg-primary text-white font-bold py-3.5 px-4 rounded-xl hover:bg-primary/90 transition-all flex items-center justify-center gap-2 mt-4 disabled:opacity-70 disabled:cursor-not-allowed">
          @if (isLoading) {
            <span class="material-symbols-outlined animate-spin">refresh</span>
            Mise à jour...
          } @else {
            <span class="material-symbols-outlined">save</span>
            Enregistrer et continuer
          }
        </button>
      </form>
    </div>
  </div>
